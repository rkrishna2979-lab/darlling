name: Build Darling APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install SDK platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project from ZIP
        run: |
          set -e
          FOUND=""
          for z in *.zip *.ZIP; do
            [ -f "$z" ] || continue
            if unzip -l "$z" | grep -q "darling-android/app/build.gradle.kts"; then
              if unzip -p "$z" darling-android/app/build.gradle.kts | grep -q '"1.0"'; then
                FOUND="$z"; break
              fi
              FOUND="${FOUND:-$z}"
            fi
          done
          if [ -z "$FOUND" ]; then echo "Darling ZIP not found in repo root"; ls -la; exit 1; fi
          echo "Extracting $FOUND"
          unzip -o "$FOUND"

      - name: Generate Gradle wrapper (Gradle 8.9)
        working-directory: darling-android
        run: |
          if [ ! -f gradlew ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/g.zip
            unzip -q /tmp/g.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: darling-android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: darling-android/app/build/outputs/apk/debug/app-debug.apk
